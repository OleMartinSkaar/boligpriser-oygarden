<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hva koster ditt postnummer? – Øygarden</title>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255,255,255,0.92);
      --panel-strong: #ffffff;
      --surface: #edf3f8;
      --surface-strong: #dfeaf4;
      --ink: #17324c;
      --muted: #5d7285;
      --line: #d5e0eb;
      --brand: #123c65;
      --brand-strong: #0d2d4c;
      --brand-soft: #dfeaf7;
      --accent: #f0b64d;
      --shadow: 0 12px 24px rgba(18,60,101,.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.45), rgba(244,247,251,0.9)),
        var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 26px 20px 48px;
    }

    header {
      margin-bottom: 22px;
      padding: 24px 20px 8px;
      border-top: 5px solid var(--brand);
      background: rgba(255,255,255,0.18);
      border-radius: 0 0 18px 18px;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.1;
      letter-spacing: -0.04em;
    }

    header p {
      max-width: 720px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.02rem;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(18,60,101,0.08);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
    }

    section { margin-bottom: 26px; }
    section h2 {
      margin: 0 0 14px;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 14px;
      align-items: center;
      width: min(100%, 960px);
    }

    .select-wrap {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .controls label {
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    select {
      width: 100%;
      min-width: 0;
      background: var(--panel-strong);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(18,60,101,0.04);
    }

    .period-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .period-nav button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .period-nav button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(18,60,101,.05);
    }

    .period-nav button.active {
      background: linear-gradient(180deg, var(--brand), var(--brand-strong));
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 8px 18px rgba(18,60,101,.14);
    }

    .map-wrapper {
      position: relative;
      overflow: auto;
      -webkit-overflow-scrolling: touch;
      background: linear-gradient(180deg, rgba(223,234,247,0.92), rgba(237,243,248,0.96));
      border: 1px solid rgba(18,60,101,0.08);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 10px;
    }

    .map {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 520px;
      height: auto;
      aspect-ratio: 1382 / 1215;
      background: transparent;
    }

    .map-label text {
      font-size: 10px;
      fill: #102e49;
      font-weight: 800;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .map-point {
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transition: r .15s ease, stroke-width .15s ease;
    }

    .map-point.active {
      stroke: var(--accent);
      stroke-width: 4;
      filter: drop-shadow(0 2px 4px rgba(240,182,77,.35));
    }

    .map-attribution {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      background: rgba(255,255,255,.9);
      border-radius: 10px;
      padding: 6px 10px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.3;
    }

    .map-attribution a { color: inherit; }

    #result {
      display: grid;
      gap: 12px;
    }

    .month-card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 18px rgba(17,41,64,.03);
    }

    .month-card summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      color: var(--ink);
    }

    .month-card summary::-webkit-details-marker { display: none; }
    .month-card summary::after {
      content: "+";
      font-size: 1.4rem;
      color: var(--muted);
      line-height: 1;
    }

    .month-card[open] summary::after { content: "−"; }

    .month-card dl {
      margin: 12px 0 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
    }

    .month-card dt {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 4px;
    }

    .month-card dd {
      margin: 0;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      main {
        padding: 16px 14px 28px;
      }

      header {
        padding: 20px 14px 6px;
      }

      .panel {
        padding: 14px 12px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .select-wrap {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .period-nav {
        justify-content: flex-start;
      }

      .period-nav button {
        flex: 1 1 30%;
        min-width: 110px;
      }

      .map-wrapper {
        padding: 8px;
      }

      .map {
        min-width: 460px;
      }

      .map-label text {
        font-size: 8px;
        stroke-width: 2;
      }

      .month-card dl {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Boligmarkedet i Øygarden</div>
      <h1>Hva koster ditt postnummer?</h1>
      <p>Samme kommune. Store prisforskjeller. Utforsk kvadratmeterprisen og se hvor mange salg det har vært i ditt område.</p>
    </header>

    <section>
      <div class="panel">
        <h2>Velg område</h2>
        <div class="controls">
          <div class="select-wrap">
            <label for="area">Postnummer</label>
            <select id="area" aria-label="Velg postnummer"></select>
          </div>
          <div class="period-nav" aria-label="Tidsperiode">
            <button type="button" class="period-btn active" data-months="12">12 mnd</button>
            <button type="button" class="period-btn" data-months="24">24 mnd</button>
            <button type="button" class="period-btn" data-months="36">36 mnd</button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="map-wrapper">
        <svg class="map" viewBox="0 0 1382 1215" preserveAspectRatio="xMidYMid meet" aria-label="Kart over Øygarden">
          <g id="map"></g>
          <g id="labels"></g>
        </svg>
        <div class="map-attribution">Data fra <a href="https://www.ssb.no/" target="_blank" rel="noopener noreferrer">Statistisk sentralbyrå</a></div>
      </div>
    </section>

    <section>
      <div class="panel">
        <h2>Pris per kvadratmeter</h2>
        <div id="result"></div>
      </div>
    </section>
  </main>

  <script>
    const monthNames = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
    let data = [];
    let selectedPeriod = 12;
    let selectedArea = '5353';

    const el = (id) => document.getElementById(id);
    const fmt = (n) => Number.isFinite(n) ? Math.round(n).toLocaleString('nb-NO') : '–';

    const locations = [
      { code: '5335', x: 278, y: 187, lx: 240, ly: 200 },
      { code: '5334', x: 322, y: 251, lx: 240, ly: 270 },
      { code: '5336', x: 342, y: 326, lx: 240, ly: 340 },
      { code: '5353', x: 482, y: 485, lx: 520, ly: 500 },
      { code: '5330', x: 612, y: 565, lx: 645, ly: 586 },
      { code: '5333', x: 700, y: 660, lx: 745, ly: 670 },
      { code: '5347', x: 820, y: 760, lx: 870, ly: 775 },
      { code: '5332', x: 505, y: 750, lx: 540, ly: 785 },
      { code: '5352', x: 728, y: 860, lx: 760, ly: 888 }
    ];

    function color(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return '#aebac4';
      const t = Math.max(0, Math.min(1, (v - 20000) / 36000));
      return `rgb(${Math.round(196 - 178 * t)}, ${Math.round(223 - 163 * t)}, ${Math.round(237 - 136 * t)})`;
    }

    function renderMap() {
      const map = el('map');
      const labels = el('labels');
      map.innerHTML = '';
      labels.innerHTML = '';

      locations.forEach((loc) => {
        const areaData = data.find((d) => d.code === loc.code);
        const price = areaData && areaData.months && areaData.months.length ? areaData.months[areaData.months.length - 1].price : null;

        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'map-point' + (loc.code === selectedArea ? ' active' : ''));
        circle.setAttribute('cx', loc.x);
        circle.setAttribute('cy', loc.y);
        circle.setAttribute('r', loc.code === selectedArea ? 21 : 15);
        circle.setAttribute('fill', color(price));
        circle.addEventListener('click', () => {
          selectedArea = loc.code;
          el('area').value = loc.code;
          renderOverview();
          renderMap();
        });
        map.appendChild(circle);

        const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        labelGroup.setAttribute('class', 'map-label');
        labelGroup.style.cursor = 'pointer';
        labelGroup.addEventListener('click', () => {
          selectedArea = loc.code;
          el('area').value = loc.code;
          renderOverview();
          renderMap();
        });

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.textContent = loc.code;
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');
        label.setAttribute('x', loc.lx);
        label.setAttribute('y', loc.ly);
        labelGroup.appendChild(label);
        labels.appendChild(labelGroup);
      });
    }

    function renderOverview() {
      const area = data.find((item) => item.code === selectedArea);
      if (!area || !Array.isArray(area.months)) {
        el('result').innerHTML = '<div class="month-card"><strong>Ingen data tilgjengelig.</strong></div>';
        return;
      }

      const entries = area.months.slice(-selectedPeriod);
      el('result').innerHTML = entries.map((entry, index) => {
        const monthIndex = (new Date().getMonth() - entries.length + 1 + index + 12) % 12;
        const year = new Date().getFullYear() - (selectedPeriod > 12 && index < entries.length - 12 ? 1 : 0);
        const label = `${monthNames[monthIndex]} ${year}`;

        return `
          <details class="month-card" ${index === entries.length - 1 ? 'open' : ''}>
            <summary>${label}</summary>
            <dl>
              <div>
                <dt>Pris per m²</dt>
                <dd>${fmt(entry.price)}</dd>
              </div>
              <div>
                <dt>Antall salg</dt>
                <dd>${entry.sales}</dd>
              </div>
            </dl>
          </details>
        `;
      }).join('');
    }

    function populateAreaSelect() {
      const list = [...new Set(data.filter((d) => /^\d/.test(d.code)).map((d) => d.code))].sort();
      const select = el('area');
      select.innerHTML = list.map((code) => `<option value="${code}">${code}</option>`).join('');
      select.value = selectedArea;
      select.addEventListener('change', (event) => {
        selectedArea = event.target.value;
        renderOverview();
        renderMap();
      });
    }

    function bindPeriodButtons() {
      document.querySelectorAll('.period-btn').forEach((button) => {
        button.addEventListener('click', () => {
          selectedPeriod = Number(button.dataset.months);
          document.querySelectorAll('.period-btn').forEach((b) => b.classList.toggle('active', b === button));
          renderOverview();
        });
      });
    }

    fetch('data.json')
      .then((response) => response.json())
      .then((payload) => {
        data = payload;
        populateAreaSelect();
        bindPeriodButtons();
        renderMap();
        renderOverview();
      })
      .catch(() => {
        el('result').innerHTML = '<div class="month-card"><strong>Kunne ikke laste inn data.</strong></div>';
      });
  </script>
</body>
</html>
