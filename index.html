<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hva koster ditt postnummer? – Øygarden</title>
  <style>
    :root {
      --bg: #f3f6f9;
      --panel: #ffffff;
      --panel-soft: #eef3f8;
      --ink: #142b43;
      --muted: #526879;
      --line: #d7e1ea;
      --brand: #123c65;
      --brand-soft: #dfeaf7;
      --shadow: 0 8px 24px rgba(18, 60, 101, 0.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    header {
      border-top: 5px solid var(--brand);
      padding: 28px 0 20px;
      margin-bottom: 24px;
    }

    .eyebrow {
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3rem);
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    header p {
      max-width: 680px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    section { margin-bottom: 28px; }
    section h2 {
      margin: 0 0 14px;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }

    .controls {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 12px 16px;
      width: min(100%, 840px);
    }

    .controls label {
      font-weight: 600;
      color: var(--muted);
    }

    select {
      width: 100%;
      min-width: 0;
      padding: 12px 14px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: var(--panel);
      color: var(--ink);
      font: inherit;
    }

    .period-nav {
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 8px;
      flex-wrap: wrap;
    }

    .period-nav button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      cursor: pointer;
      transition: all .15s ease;
    }

    .period-nav button.active {
      background: var(--brand);
      border-color: var(--brand);
      color: #fff;
      box-shadow: var(--shadow);
    }

    .map-wrapper {
      position: relative;
      overflow: auto;
      background: #edf3f8;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 8px;
      -webkit-overflow-scrolling: touch;
    }

    .map {
      display: block;
      width: 100%;
      max-width: 100%;
      min-width: 560px;
      height: auto;
      aspect-ratio: 1382 / 1215;
      background: #edf3f8;
    }

    .map-label text {
      font-size: 10px;
      fill: #102e49;
      font-weight: 800;
      paint-order: stroke;
      stroke: #fff;
      stroke-width: 3;
      stroke-linejoin: round;
    }

    .map-point {
      stroke: #fff;
      stroke-width: 2;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transition: transform .15s ease;
    }

    .map-point.active {
      stroke: #eaa523;
      stroke-width: 4;
    }

    .map-attribution {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(255,255,255,.92);
      padding: 6px 10px;
      color: var(--muted);
      font-size: 9px;
      line-height: 1.3;
      border-top: 1px solid rgba(18,60,101,.08);
    }

    .map-attribution a { color: inherit; }

    #result {
      display: grid;
      gap: 12px;
    }

    .month-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px 16px;
      box-shadow: 0 4px 14px rgba(20,43,67,.03);
    }

    .month-card summary {
      list-style: none;
      cursor: pointer;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .month-card summary::-webkit-details-marker { display: none; }
    .month-card summary::after {
      content: "+";
      font-size: 1.2rem;
      color: var(--muted);
    }

    .month-card[open] summary::after { content: "−"; }

    .month-card dl {
      margin: 12px 0 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px 12px;
    }

    .month-card dt {
      color: var(--muted);
      font-size: .86rem;
    }

    .month-card dd {
      margin: 0;
      font-weight: 700;
    }

    @media (max-width: 760px) {
      main {
        padding: 20px 14px 32px;
      }

      header {
        padding-top: 20px;
        margin-bottom: 18px;
      }

      .controls {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      select {
        padding: 10px 12px;
        font-size: 16px;
      }

      .period-nav {
        width: 100%;
      }

      .period-nav button {
        flex: 1 1 48%;
        min-width: 110px;
        padding: 9px 10px;
      }

      .map-wrapper {
        padding: 6px;
      }

      .map {
        min-width: 480px;
      }

      .map-label text {
        font-size: 8px;
        stroke-width: 2;
      }

      .month-card {
        padding: 12px 14px;
      }

      .month-card dl {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Boligmarkedet i Øygarden</div>
      <h1>Hva koster ditt postnummer?</h1>
      <p>Samme kommune. Store prisforskjeller. Utforsk kvadratmeterprisen og se hvor mange salg det har vært i ditt område.</p>
    </header>

    <section>
      <h2>Velg område</h2>
      <div class="controls">
        <label for="area">Postnummer</label>
        <div class="period-nav">
          <button type="button" class="period-btn active" data-months="12">Siste 12 mnd</button>
          <button type="button" class="period-btn" data-months="24">Siste 24 mnd</button>
          <button type="button" class="period-btn" data-months="36">Siste 36 mnd</button>
        </div>
        <select id="area" aria-label="Velg postnummer"></select>
      </div>
    </section>

    <section>
      <div class="map-wrapper">
        <svg class="map" viewBox="0 0 1382 1215" preserveAspectRatio="xMidYMid meet" aria-label="Kart over Øygarden">
          <g id="map"></g>
          <g id="labels"></g>
        </svg>
        <div class="map-attribution">Data fra <a href="https://www.ssb.no/" target="_blank" rel="noopener noreferrer">Statistisk sentralbyrå</a></div>
      </div>
    </section>

    <section>
      <h2>Pris per kvadratmeter</h2>
      <div id="result"></div>
    </section>
  </main>

  <script>
    const monthNames = ['januar','februar','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
    let data = [];
    let selectedPeriod = 12;
    let selectedArea = '5353';

    const el = (id) => document.getElementById(id);
    const fmt = (n) => Number.isFinite(n) ? Math.round(n).toLocaleString('nb-NO') : '–';

    const locations = [
      { code: '5335', x: 278, y: 187, lx: 240, ly: 200 },
      { code: '5334', x: 322, y: 251, lx: 240, ly: 270 },
      { code: '5336', x: 342, y: 326, lx: 240, ly: 340 },
      { code: '5353', x: 482, y: 485, lx: 520, ly: 500 },
      { code: '5330', x: 612, y: 565, lx: 645, ly: 586 },
      { code: '5333', x: 700, y: 660, lx: 745, ly: 670 },
      { code: '5347', x: 820, y: 760, lx: 870, ly: 775 },
      { code: '5332', x: 505, y: 750, lx: 540, ly: 785 },
      { code: '5352', x: 728, y: 860, lx: 760, ly: 888 }
    ];

    function color(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return '#aebac4';
      const t = Math.max(0, Math.min(1, (v - 20000) / 36000));
      return `rgb(${Math.round(196 - 178 * t)}, ${Math.round(223 - 163 * t)}, ${Math.round(237 - 136 * t)})`;
    }

    function renderMap() {
      const map = el('map');
      const labels = el('labels');
      map.innerHTML = '';
      labels.innerHTML = '';

      locations.forEach((loc) => {
        const areaData = data.find((d) => d.code === loc.code);
        const price = areaData && areaData.months && areaData.months.length ? areaData.months[areaData.months.length - 1].price : null;
        const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
        circle.setAttribute('class', 'map-point' + (loc.code === selectedArea ? ' active' : ''));
        circle.setAttribute('cx', loc.x);
        circle.setAttribute('cy', loc.y);
        circle.setAttribute('r', loc.code === selectedArea ? 21 : 15);
        circle.setAttribute('fill', color(price));
        circle.style.cursor = 'pointer';
        circle.addEventListener('click', () => {
          selectedArea = loc.code;
          el('area').value = loc.code;
          renderOverview();
          renderMap();
        });
        map.appendChild(circle);

        const labelGroup = document.createElementNS('http://www.w3.org/2000/svg', 'g');
        labelGroup.setAttribute('class', 'map-label');
        labelGroup.setAttribute('transform', `translate(${loc.lx}, ${loc.ly})`);
        labelGroup.style.cursor = 'pointer';
        labelGroup.addEventListener('click', () => {
          selectedArea = loc.code;
          el('area').value = loc.code;
          renderOverview();
          renderMap();
        });

        const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        label.textContent = loc.code;
        label.setAttribute('text-anchor', 'middle');
        label.setAttribute('dominant-baseline', 'middle');
        labelGroup.appendChild(label);
        labels.appendChild(labelGroup);
      });
    }

    function renderOverview() {
      const area = data.find((item) => item.code === selectedArea);
      if (!area || !Array.isArray(area.months)) {
        el('result').innerHTML = '<div class="month-card"><strong>Ingen data tilgjengelig.</strong></div>';
        return;
      }

      const entries = area.months.slice(-selectedPeriod);
      el('result').innerHTML = entries.map((entry, index) => {
        const monthIndex = (new Date().getMonth() - entries.length + 1 + index + 12) % 12;
        const year = new Date().getFullYear() - (selectedPeriod > 12 && index < entries.length - 12 ? 1 : 0);
        const label = `${monthNames[monthIndex]} ${year}`;
        return `
          <details class="month-card" ${index === entries.length - 1 ? 'open' : ''}>
            <summary>${label}</summary>
            <dl>
              <div>
                <dt>Pris per m²</dt>
                <dd>${fmt(entry.price)}</dd>
              </div>
              <div>
                <dt>Antall salg</dt>
                <dd>${entry.sales}</dd>
              </div>
            </dl>
          </details>
        `;
      }).join('');
    }

    function populateAreaSelect() {
      const list = [...new Set(data.filter((d) => /^\d/.test(d.code)).map((d) => d.code))].sort();
      const select = el('area');
      select.innerHTML = list.map((code) => `<option value="${code}">${code}</option>`).join('');
      select.value = selectedArea;
      select.addEventListener('change', (event) => {
        selectedArea = event.target.value;
        renderOverview();
        renderMap();
      });
    }

    function bindPeriodButtons() {
      document.querySelectorAll('.period-btn').forEach((button) => {
        button.addEventListener('click', () => {
          selectedPeriod = Number(button.dataset.months);
          document.querySelectorAll('.period-btn').forEach((b) => b.classList.toggle('active', b === button));
          renderOverview();
        });
      });
    }

    fetch('data.json')
      .then((response) => response.json())
      .then((payload) => {
        data = payload;
        populateAreaSelect();
        bindPeriodButtons();
        renderMap();
        renderOverview();
      })
      .catch(() => {
        el('result').innerHTML = '<div class="month-card"><strong>Kunne ikke laste inn data.</strong></div>';
      });
  </script>
</body>
</html>
