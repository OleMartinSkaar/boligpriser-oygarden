<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Hva koster ditt postnummer? – Øygarden</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <style>
    :root {
      --bg: #f4f7fb;
      --panel: rgba(255,255,255,0.92);
      --panel-strong: #ffffff;
      --surface: #edf3f8;
      --line: #d5e0eb;
      --ink: #17324c;
      --muted: #5d7285;
      --brand: #123c65;
      --brand-strong: #0d2d4c;
      --brand-soft: #dfeaf7;
      --brand-light: #b9d1eb;
      --shadow: 0 12px 24px rgba(18,60,101,.08);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: linear-gradient(180deg, rgba(255,255,255,0.45), rgba(244,247,251,0.9)), var(--bg);
      color: var(--ink);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      overflow-x: hidden;
    }

    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 26px 20px 48px;
    }

    header {
      margin-bottom: 20px;
      padding: 24px 20px 8px;
      border-top: 5px solid var(--brand);
      background: rgba(255,255,255,0.18);
      border-radius: 0 0 18px 18px;
    }

    .eyebrow {
      margin-bottom: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 4vw, 3.1rem);
      line-height: 1.15;
      letter-spacing: -0.04em;
    }

    header p {
      max-width: 720px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 1.03rem;
      line-height: 1.6;
    }

    .panel {
      background: var(--panel);
      border: 1px solid rgba(18,60,101,0.08);
      border-radius: 18px;
      box-shadow: var(--shadow);
      padding: 18px 18px 16px;
    }

    section { margin-bottom: 28px; }
    section h2 {
      margin: 0 0 14px;
      font-size: clamp(1.2rem, 2vw, 1.6rem);
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px 14px;
      align-items: center;
      width: min(100%, 960px);
    }

    .select-wrap {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .controls label {
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    select {
      width: 100%;
      min-width: 0;
      background: var(--panel-strong);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(18,60,101,0.04);
    }

    .period-nav {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
    }

    .period-nav button {
      appearance: none;
      border: 1px solid var(--line);
      background: var(--panel-strong);
      color: var(--ink);
      border-radius: 999px;
      padding: 9px 14px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease;
    }

    .period-nav button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(18,60,101,.05);
    }

    .period-nav button.active {
      background: linear-gradient(180deg, var(--brand), var(--brand-strong));
      border-color: var(--brand);
      color: #fff;
      box-shadow: 0 8px 18px rgba(18,60,101,.14);
    }

    .map-wrapper {
      position: relative;
      background: linear-gradient(180deg, rgba(223,234,247,0.92), rgba(237,243,248,0.96));
      border: 1px solid rgba(18,60,101,0.08);
      border-radius: 18px;
      box-shadow: var(--shadow);
      overflow: hidden;
      height: 480px;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .leaflet-container {
      background: #f0f4f8;
      font-family: inherit;
    }

    .map-popup {
      font-size: 14px;
      font-weight: 600;
    }

    .map-popup dt {
      color: var(--muted);
      font-size: 12px;
      margin-top: 6px;
    }

    .map-popup dd {
      margin: 2px 0 0;
      font-weight: 700;
    }

    #result {
      display: grid;
      gap: 12px;
    }

    .month-card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 12px 14px;
      box-shadow: 0 8px 18px rgba(17,41,64,.03);
    }

    .month-card summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      cursor: pointer;
      font-weight: 700;
      color: var(--ink);
    }

    .month-card summary::-webkit-details-marker { display: none; }
    .month-card summary::after {
      content: "+";
      font-size: 1.4rem;
      color: var(--muted);
      line-height: 1;
    }

    .month-card[open] summary::after { content: "−"; }

    .month-card dl {
      margin: 12px 0 0;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px 12px;
    }

    .month-card dt {
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 4px;
    }

    .month-card dd {
      margin: 0;
      font-weight: 800;
    }

    @media (max-width: 760px) {
      main {
        padding: 16px 14px 28px;
      }

      header {
        padding: 20px 14px 6px;
      }

      .panel {
        padding: 14px 12px;
      }

      .controls {
        grid-template-columns: 1fr;
      }

      .select-wrap {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .period-nav {
        justify-content: flex-start;
      }

      .period-nav button {
        flex: 1 1 30%;
        min-width: 110px;
      }

      .map-wrapper {
        height: 400px;
      }

      .month-card dl {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="eyebrow">Boligmarkedet i Øygarden</div>
      <h1>Hva koster ditt postnummer?</h1>
      <p>Samme kommune. Store prisforskjeller. Utforsk kvadratmeterprisen og se hvor mange salg det har vært i ditt område.</p>
    </header>

    <section>
      <div class="panel">
        <h2>Velg område</h2>
        <div class="controls">
          <div class="select-wrap">
            <label for="area">Postnummer</label>
            <select id="area" aria-label="Velg postnummer"></select>
          </div>
          <div class="period-nav" aria-label="Tidsperiode">
            <button type="button" class="period-btn active" data-months="12">12 mnd</button>
            <button type="button" class="period-btn" data-months="24">24 mnd</button>
            <button type="button" class="period-btn" data-months="36">36 mnd</button>
          </div>
        </div>
      </div>
    </section>

    <section>
      <div class="map-wrapper">
        <div id="map" aria-label="Interaktivt kart over Øygarden"></div>
      </div>
    </section>

    <section>
      <div class="panel">
        <h2>Pris per kvadratmeter</h2>
        <div id="result"></div>
      </div>
    </section>
  </main>

  <script>
    const monthNames = ['januar','februari','mars','april','mai','juni','juli','august','september','oktober','november','desember'];
    let data = [];
    let selectedPeriod = 12;
    let selectedArea = '5353';
    let map;
    let markers = {};

    const el = (id) => document.getElementById(id);
    const fmt = (n) => Number.isFinite(n) ? Math.round(n).toLocaleString('nb-NO') : '–';

    const locations = [
      { code: '5335', lat: 59.0180, lng: 4.8850 },
      { code: '5334', lat: 59.0240, lng: 4.9120 },
      { code: '5336', lat: 59.0320, lng: 4.9380 },
      { code: '5353', lat: 59.0480, lng: 5.0120 },
      { code: '5330', lat: 59.0620, lng: 5.0850 },
      { code: '5333', lat: 59.0720, lng: 5.1420 },
      { code: '5347', lat: 59.0880, lng: 5.2180 },
      { code: '5332', lat: 59.0580, lng: 5.0280 },
      { code: '5352', lat: 59.0780, lng: 5.1680 }
    ];

    function getAreaRows(area) {
      const rows = Array.isArray(area && area.rows) ? area.rows : Array.isArray(area && area.months) ? area.months : [];
      return [...rows].sort((a, b) => {
        const aKey = a && (a.month || a.date || '');
        const bKey = b && (b.month || b.date || '');
        if (!aKey || !bKey) return 0;
        return new Date(aKey + '-01T00:00:00') - new Date(bKey + '-01T00:00:00');
      });
    }

    function getLatestEntry(area) {
      const rows = getAreaRows(area);
      if (!rows.length) return null;
      return rows[rows.length - 1];
    }

    function color(v) {
      if (v === null || v === undefined || Number.isNaN(v)) return '#c7d9ee';
      const t = Math.max(0, Math.min(1, (v - 20000) / 36000));
      const r = Math.round(188 + (42 * t));
      const g = Math.round(213 + (10 * t));
      const b = Math.round(240 - (15 * t));
      return `rgb(${r}, ${g}, ${b})`;
    }

    function initMap() {
      map = L.map('map').setView([59.055, 5.05], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        maxZoom: 18,
        minZoom: 11
      }).addTo(map);
      renderMapMarkers();
    }

    function renderMapMarkers() {
      Object.values(markers).forEach(marker => {
        if (map.hasLayer(marker)) map.removeLayer(marker);
      });
      markers = {};

      locations.forEach((loc) => {
        const areaData = data.find((d) => d.code === loc.code);
        const latest = getLatestEntry(areaData);
        const price = Number(latest && (latest.price ?? latest.medianSqm ?? null));
        const sales = latest ? (latest.n ?? latest.sales ?? 0) : 0;
        const bgColor = color(price);
        const isSelected = loc.code === selectedArea;
        const iconSize = isSelected ? 32 : 24;

        const iconHtml = `
          <div style="
            width: ${iconSize}px;
            height: ${iconSize}px;
            background: ${bgColor};
            border: ${isSelected ? '4px solid #123c65' : '2px solid rgba(255,255,255,0.96)'};
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 10px;
            color: #102e49;
            box-shadow: 0 2px 8px rgba(18,60,101,0.15);
            cursor: pointer;
          ">${loc.code}</div>
        `;

        const customIcon = L.divIcon({
          html: iconHtml,
          iconSize: [iconSize, iconSize],
          iconAnchor: [iconSize / 2, iconSize / 2],
          popupAnchor: [0, -iconSize / 2 - 8],
          className: 'custom-marker'
        });

        const popup = `
          <div class="map-popup">
            <strong>Postnummer ${loc.code}</strong>
            <dl>
              <dt>Pris per m²</dt>
              <dd>${fmt(price)}</dd>
              <dt>Antall salg</dt>
              <dd>${sales}</dd>
            </dl>
          </div>
        `;

        const marker = L.marker([loc.lat, loc.lng], { icon: customIcon })
          .bindPopup(popup)
          .on('click', () => {
            selectedArea = loc.code;
            el('area').value = loc.code;
            renderOverview();
            renderMapMarkers();
          })
          .addTo(map);

        markers[loc.code] = marker;
      });
    }

    function renderOverview() {
      const area = data.find((item) => item.code === selectedArea);
      if (!area) {
        el('result').innerHTML = '<div class="month-card"><strong>Ingen data tilgjengelig.</strong></div>';
        return;
      }

      const rows = getAreaRows(area);
      if (!rows.length) {
        el('result').innerHTML = '<div class="month-card"><strong>Ingen data tilgjengelig.</strong></div>';
        return;
      }

      const entries = rows.slice(-selectedPeriod);
      el('result').innerHTML = entries.map((entry, index) => {
        const monthKey = entry.month || entry.date;
        const date = monthKey ? new Date(monthKey + '-01T00:00:00') : new Date();
        const label = `${monthNames[date.getMonth()]} ${date.getFullYear()}`;

        return `
          <details class="month-card" ${index === entries.length - 1 ? 'open' : ''}>
            <summary>${label}</summary>
            <dl>
              <div>
                <dt>Pris per m²</dt>
                <dd>${fmt(Number(entry.price ?? entry.medianSqm ?? 0))}</dd>
              </div>
              <div>
                <dt>Antall salg</dt>
                <dd>${entry.n ?? entry.sales ?? 0}</dd>
              </div>
            </dl>
          </details>
        `;
      }).join('');
    }

    function populateAreaSelect() {
      const list = [...new Set(data.map((d) => d.code))].sort();
      const select = el('area');
      select.innerHTML = list.map((code) => `<option value="${code}">${code}</option>`).join('');
      if (!list.includes(selectedArea)) selectedArea = list[0] || '5353';
      select.value = selectedArea;
      select.addEventListener('change', (event) => {
        selectedArea = event.target.value;
        renderOverview();
        renderMapMarkers();
      });
    }

    function bindPeriodButtons() {
      document.querySelectorAll('.period-btn').forEach((button) => {
        button.addEventListener('click', () => {
          selectedPeriod = Number(button.dataset.months);
          document.querySelectorAll('.period-btn').forEach((b) => b.classList.toggle('active', b === button));
          renderOverview();
        });
      });
    }

    fetch('data.json')
      .then((response) => response.json())
      .then((payload) => {
        data = Array.isArray(payload) ? payload : [];
        if (!data.length) {
          el('result').innerHTML = '<div class="month-card"><strong>Kunne ikke laste inn data.</strong></div>';
          return;
        }

        initMap();
        populateAreaSelect();
        bindPeriodButtons();
        renderOverview();
      })
      .catch(() => {
        el('result').innerHTML = '<div class="month-card"><strong>Kunne ikke laste inn data.</strong></div>';
      });
  </script>
</body>
</html>
